<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chamberMenu" class="chamber-menu noselect is-collapsed" aria-hidden="true">
        <div class="chamber-panel">
            <button class="chamber-row chamber-row-main" type="button" data-chamber-toggle>
                <span class="chamber-icon">+</span>
                <span class="chamber-row-title">Chamber Wars</span>
                <span id="chamberCount" class="chamber-count">0</span>
                <span class="chamber-chevron">^</span>
            </button>
            <div class="chamber-expanded">
                <button id="chamberStart" class="chamber-action chamber-action-primary" type="button">Start lobby</button>
                <button id="chamberJoin" class="chamber-action" type="button">Join lobby</button>
                <div id="chamberLobbyList" class="chamber-lobby-list" aria-hidden="true"></div>
            </div>
            <div class="chamber-footer">
                <button id="chamberClose" type="button">Sluiten</button>
            </div>
        </div>
    </div>
    <div id="lobbyOverlay" class="lobby-overlay noselect" aria-hidden="true">
        <div class="lobby-panel">
            <div class="lobby-header">
                <div>
                    <span class="lobby-kicker">Waiting lobby</span>
                    <h1>Chamber Wars</h1>
                </div>
                <div id="lobbyCount" class="lobby-count">0/0</div>
            </div>
            <div id="lobbyStatus" class="lobby-status">Waiting for players</div>
            <div id="lobbyHint" class="lobby-hint">Minimaal 2 spelers nodig</div>
            <div id="lobbyPlayers" class="lobby-players"></div>
            <div class="lobby-footer">
                <button id="lobbyLeave" type="button">Lobby verlaten</button>
            </div>
        </div>
    </div>
    <div id="weaponVote" class="weapon-vote noselect" aria-hidden="true">
        <div class="weapon-vote-header">
            <span>Chamber Wars</span>
            <h1>Stem op het wapen</h1>
            <p>Het wapen met de meeste stemmen wordt deze ronde gekozen. Knife krijg je altijd.</p>
        </div>
        <div id="weaponVoteCards" class="weapon-vote-cards"></div>
        <div class="weapon-vote-bottom">
            <span>Tijd over:</span>
            <strong id="weaponVoteTimer">10s</strong>
        </div>
    </div>
    <div id="intro" class="intro noselect" aria-hidden="true">
        <div id="container">
          <svg id="anim-svg" viewBox="0 0 200 200">
            <circle id="a-bg"    cx="100" cy="100" r="90" fill="#1c0000" stroke="#6b0000" stroke-width="3"/>
            <circle              cx="100" cy="100" r="82" fill="none"    stroke="#3a0000" stroke-width="1"/>
            <circle id="a-outer" cx="100" cy="100" r="94" fill="none"   stroke="#880000" stroke-width="1" opacity="0.4" style="display:none"/>
            <path id="a-arc" d="M 10,100 A 90,90 0 0 1 190,100" fill="none" stroke="#8B0000" stroke-width="4" stroke-linecap="round"/>
            <text id="a-sub" x="100" y="42"  text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#5c0000" letter-spacing="3">READY</text>
            <text id="a-num" x="100" y="122" text-anchor="middle" font-family="monospace" font-size="90" font-weight="900" fill="#8B0000">3</text>
          </svg>

          <div class="dots">
            <div class="dot" id="d0"></div>
            <div class="dot" id="d1"></div>
            <div class="dot" id="d2"></div>
          </div>

          <div id="status">COMBAT SEQUENCE STARTING</div>
        </div>
    </div>
    <div id="killfeed" class="killfeed" aria-hidden="true"></div>
    <div id="deathcam" class="deathcam" aria-hidden="true">
        <div class="deathcam-line"></div>
        <div class="deathcam-main">
            <div class="deathcam-label">Deathcam</div>
            <div id="deathcamName" class="deathcam-name">Unknown</div>
            <div id="deathcamMeta" class="deathcam-meta">Spectating killer</div>
        </div>
        <div class="deathcam-stats">
            <div class="deathcam-stat">
                <img src="img/pistol.png" alt="">
                <span id="deathcamKills">0</span>
            </div>
            <div class="deathcam-stat">
                <img src="img/heart.png" alt="">
                <span id="deathcamLives">0</span>
            </div>
        </div>
    </div>
    <div id="leaderboard" class="leaderboard" aria-hidden="true">
        <div class="leaderboard-header">
            <div class="leaderboard-title">
                <span class="leaderboard-dot"></span>
                <span>Leaderboard</span>
            </div>
        </div>
        <div class="leaderboard-columns" aria-hidden="true">
            <span></span>
            <span></span>
            <img class="leaderboard-column-icon leaderboard-pistol" src="img/pistol.png" alt="">
            <img class="leaderboard-column-icon leaderboard-heart" src="img/heart.png" alt="">
        </div>
        <div id="leaderboardRows" class="leaderboard-rows"></div>
    </div>
    <div id="lives" class="lives" aria-hidden="true"></div>
    <script src="icons.js"></script>
    <script src="script.js"></script>
</body>
</html>
